# Versión para Windows: superposición sobre deploy/docker-compose.yml de Duix.Avatar. Sustituye el servicio de voz fish-speech por
# OmniVoice manteniendo el mismo nombre, puerto (18180) y carpeta de datos, así que la
# app de escritorio de Duix.Avatar sigue funcionando sin cambios.
#
#   docker build -t omnivoice-duix .        # desde la raíz de este repo
#   docker compose -f $HOME\Duix-Avatar\deploy\docker-compose.yml `
#                  -f deploy\docker-compose.omnivoice.windows.yml up -d
services:
  duix-avatar-tts:
    image: omnivoice-duix:latest
    container_name: duix-avatar-tts
    restart: always
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - OMNIVOICE_LANGUAGE=${OMNIVOICE_LANGUAGE:-}
    ports:
      - '18180:8080'
    volumes:
      - d:/duix_avatar_data/voice/data:/code/data
      - omnivoice_models:/models
    command: ["omnivoice-duix-server", "--port", "8080", "--data-root", "/code/data", "--preload"]

volumes:
  omnivoice_models:
